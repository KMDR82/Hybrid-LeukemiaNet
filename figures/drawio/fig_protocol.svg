<marker id="ah_red" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.6" markerHeight="6.6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A82424"/></marker>
</defs>
<rect width="1060" height="640" fill="#FFFFFF"/>
<rect x="10" y="10" width="1040" height="175" rx="6" fill="#FAFAFA" stroke="#C4C4C4" stroke-width="1"/>
<text x="20" y="28.3" font-size="14.3" font-weight="bold" fill="#262626" text-anchor="start">Stage 1   Source phase: C-NMC 2019 training phase</text>
<rect x="30" y="48" width="220" height="92" rx="7.4" fill="#DCE9F6" stroke="#2F6699" stroke-width="1.3"/>
<text x="140.0" y="82.0" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Training-phase data</text>
<text x="140.0" y="98.8" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">73 subjects (47 ALL / 26 HEM)</text>
<text x="140.0" y="115.7" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">10,661 cells</text>
<rect x="300" y="48" width="340" height="92" rx="7.4" fill="#DCE9F6" stroke="#2F6699" stroke-width="1.3"/>
<text x="470.0" y="73.6" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Subject-level 5-fold cross-validation</text>
<text x="470.0" y="90.4" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">StratifiedGroupKFold (by subject, by class)</text>
<text x="470.0" y="107.2" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">inner validation: 10% of training subjects</text>
<text x="470.0" y="124.1" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">early stopping on validation loss</text>
<rect x="700" y="48" width="330" height="92" rx="7.4" fill="#E2F0DE" stroke="#3B7D3A" stroke-width="1.3"/>
<text x="865.0" y="73.6" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Final source model</text>
<text x="865.0" y="90.4" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">trained on all 73 subjects</text>
<text x="865.0" y="107.2" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">for the median early-stopping epoch</text>
<text x="865.0" y="124.1" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">(no fold model selected)</text>
<text x="470.0" y="165.2" font-size="12.1" font-weight="normal" font-style="italic" fill="#262626" text-anchor="middle">Out-of-fold predictions: CV metrics and secondary threshold (Youden J)</text>
<rect x="10" y="200" width="1040" height="175" rx="6" fill="#FAFAFA" stroke="#C4C4C4" stroke-width="1"/>
<text x="20" y="218.3" font-size="14.3" font-weight="bold" fill="#262626" text-anchor="start">Stage 2   Target phase: C-NMC 2019 preliminary-test phase, five random subject-level splits</text>
<rect x="30" y="245" width="220" height="92" rx="7.4" fill="#FBE8D3" stroke="#B3611B" stroke-width="1.3"/>
<text x="140.0" y="279.0" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Preliminary-test-phase data</text>
<text x="140.0" y="295.8" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">28 subjects (13 ALL / 15 HEM)</text>
<text x="140.0" y="312.7" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">1,867 cells</text>
<rect x="290" y="232" width="365" height="128" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="1" stroke-dasharray="4 3"/>
<text x="300" y="250.3" font-size="14.3" font-weight="bold" fill="#262626" text-anchor="start"></text>
<text x="300.0" y="248.2" font-size="12.1" font-weight="normal" font-style="italic" fill="#262626" text-anchor="start">Split r = 1, …, 5 (seeds 42–46, stratified by class)</text>
<rect x="300" y="258" width="165" height="90" rx="7.2" fill="#FBE8D3" stroke="#B3611B" stroke-width="1.3"/>
<text x="382.5" y="291.0" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Adaptation-train</text>
<text x="382.5" y="307.8" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">4 subjects</text>
<text x="382.5" y="324.7" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">(2 ALL / 2 HEM)</text>
<rect x="480" y="258" width="165" height="90" rx="7.2" fill="#FBE8D3" stroke="#B3611B" stroke-width="1.3"/>
<text x="562.5" y="291.0" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Adaptation-validation</text>
<text x="562.5" y="307.8" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">2 subjects</text>
<text x="562.5" y="324.7" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">(1 ALL / 1 HEM)</text>
<rect x="840" y="245" width="190" height="103" rx="8.2" fill="#F7D9D9" stroke="#A82424" stroke-width="1.3"/>
<text x="935.0" y="267.7" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Held-out test</text>
<text x="935.0" y="284.5" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">22 subjects</text>
<text x="935.0" y="301.3" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">(10 ALL / 12 HEM)</text>
<text x="935.0" y="318.2" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">never used for any</text>
<text x="935.0" y="335.0" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">selection</text>
<rect x="10" y="390" width="1040" height="210" rx="6" fill="#FAFAFA" stroke="#C4C4C4" stroke-width="1"/>
<text x="20" y="408.3" font-size="14.3" font-weight="bold" fill="#262626" text-anchor="start">Stage 3   Evaluation on the held-out test subjects of each split</text>
<rect x="30" y="430" width="220" height="120" rx="9.6" fill="#ECECEC" stroke="#555555" stroke-width="1.3"/>
<text x="140.0" y="461.2" font-size="13.8" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Evaluation</text>
<text x="140.0" y="478.0" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">22 test subjects per split</text>
<text x="140.0" y="494.8" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">without / with TTA (K = 3)</text>
<text x="140.0" y="511.7" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">subject-bootstrap 95% CIs</text>
<text x="140.0" y="528.5" font-size="13.8" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">paired comparisons</text>
<rect x="300" y="430" width="345" height="62" rx="5.0" fill="#E2F0DE" stroke="#3B7D3A" stroke-width="1.3"/>
<text x="472.5" y="449.5" font-size="13.2" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Adapted model</text>
<text x="472.5" y="465.6" font-size="13.2" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">final source model fine-tuned on adaptation-train,</text>
<text x="472.5" y="481.7" font-size="13.2" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">early stopping on adaptation-validation loss</text>
<rect x="300" y="512" width="345" height="50" rx="4.0" fill="#E2F0DE" stroke="#3B7D3A" stroke-width="1.3"/>
<text x="472.5" y="533.6" font-size="13.2" font-weight="bold" font-style="normal" fill="#262626" text-anchor="middle">Zero-shot model</text>
<text x="472.5" y="549.7" font-size="13.2" font-weight="normal" font-style="normal" fill="#262626" text-anchor="middle">final source model, no update</text>
<text x="78.0" y="622.2" font-size="12.1" font-weight="normal" font-style="normal" fill="#262626" text-anchor="start">model initialisation / flow</text>
<text x="308.0" y="622.2" font-size="12.1" font-weight="normal" font-style="normal" fill="#262626" text-anchor="start">data used for fine-tuning or early stopping</text>
<text x="623.0" y="622.2" font-size="12.1" font-weight="normal" font-style="normal" fill="#262626" text-anchor="start">data used only for final evaluation</text>
<text x="1040.0" y="622.2" font-size="12.1" font-weight="normal" font-style="italic" fill="#262626" text-anchor="end">Same protocol for all three models</text>
