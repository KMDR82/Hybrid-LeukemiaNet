<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
